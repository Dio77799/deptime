name: upgrade-check

# DT-GTM-06: DepTime's own action on DepTime's own dependency updates (httpx, pydantic, mcp and others are covered
# packages). It runs DepTime from this checkout (`deptime: .`), so a pull request is checked by the code it carries,
# as `ci` tests it; another project uses the pinned release (docs/github-action.md).
on:
  pull_request:
    paths: ["uv.lock", "pyproject.toml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          deptime: .
